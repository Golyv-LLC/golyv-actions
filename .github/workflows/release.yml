name: Release

# Promote a release to production without rebuilding. A release tag pushed on a
# commit that staging already built adds that tag to the existing image, then
# writes the tag into the production instances' chart values. Production
# ArgoCD apps are expected to have auto-sync off, so a human performs the sync.

on:
  workflow_call:
    inputs:
      image-name:
        description: ECR repository name
        type: string
        required: true
      aws-role:
        description: IAM role ARN to assume via OIDC
        type: string
        required: true
      chart-files:
        description: Newline-separated values files of the instances to release
        type: string
        required: true
      chart-set:
        description: yq assignments, e.g. .image.tag = strenv(TAG)
        type: string
        required: false
        default: .image.tag = strenv(TAG)
      chart-branch:
        type: string
        required: false
        default: dev
      release-tag:
        description: Release version. Defaults to the pushed tag name.
        type: string
        required: false
        default: ''
      aws-region:
        type: string
        required: false
        default: eu-west-1
      ecr-registry:
        type: string
        required: false
        default: 749087126681.dkr.ecr.eu-west-1.amazonaws.com
      actions-ref:
        description: Ref of Golyv-LLC/golyv-actions to use
        type: string
        required: false
        default: v2
    secrets:
      GOLYV_CI_APP_ID:
        required: true
      GOLYV_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  id-token: write   # OIDC federation to AWS
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve versions
        id: v
        shell: bash
        env:
          REQUESTED: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-$GITHUB_REF_NAME}"
          # The tagged commit's short SHA is the tag staging built.
          echo "release=$tag"            >> "$GITHUB_OUTPUT"
          echo "source=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from commit ${GITHUB_SHA:0:8}"

      - name: Checkout shared actions
        uses: actions/checkout@v4
        with:
          repository: Golyv-LLC/golyv-actions
          ref: ${{ inputs.actions-ref }}
          path: .golyv-actions

      - name: Promote image
        id: promote
        uses: ./.golyv-actions/actions/ecr-promote
        with:
          repository: ${{ inputs.image-name }}
          source-tag: ${{ steps.v.outputs.source }}
          target-tag: ${{ steps.v.outputs.release }}
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Mint charts token
        id: charts-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GOLYV_CI_APP_ID }}
          private-key: ${{ secrets.GOLYV_CI_APP_PRIVATE_KEY }}
          owner: Golyv-LLC
          repositories: golyv-charts

      - name: Bump production values
        uses: ./.golyv-actions/actions/bump-chart-values
        with:
          token: ${{ steps.charts-token.outputs.token }}
          image-tag: ${{ steps.v.outputs.release }}
          image-repo: ${{ inputs.ecr-registry }}/${{ inputs.image-name }}
          branch: ${{ inputs.chart-branch }}
          files: ${{ inputs.chart-files }}
          set: ${{ inputs.chart-set }}
          commit-message: Release ${{ inputs.image-name }} ${{ steps.v.outputs.release }}

      - name: Next step
        shell: bash
        run: |
          {
            echo "### Ready to release"
            echo ""
            echo "Production values now reference \`${{ steps.v.outputs.release }}\`."
            echo "Production ArgoCD apps do not auto-sync: **sync them in ArgoCD** to release."
          } >> "$GITHUB_STEP_SUMMARY"
