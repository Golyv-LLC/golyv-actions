name: ECR build and push
description: >-
  Build a Docker image and push it to Amazon ECR, tagged with the 8-character
  short commit SHA. Ports the `build-and-push` stage of the GitLab pipelines.

inputs:
  image-name:
    description: ECR repository name, e.g. hospital-backend-dev
    required: true
  role-to-assume:
    description: IAM role ARN to assume via GitHub OIDC
    required: true
  dockerfile:
    description: Path to the Dockerfile, relative to the context
    required: false
    default: Dockerfile
  context:
    description: Build context
    required: false
    default: .
  aws-region:
    description: AWS region of the ECR registry
    required: false
    default: eu-west-1
  ecr-registry:
    description: ECR registry host
    required: false
    default: 749087126681.dkr.ecr.eu-west-1.amazonaws.com
  push-latest:
    description: Also push the `latest` tag
    required: false
    default: 'true'
  build-args:
    description: Newline-separated build args
    required: false
    default: ''
  env-secret-id:
    description: >-
      Optional Secrets Manager secret id. When set, its key/value JSON is written
      to a .env file in the build context before building. ondemand-backend relies
      on this. The contents are never printed.
    required: false
    default: ''

outputs:
  image-tag:
    description: The 8-character short SHA used as the image tag
    value: ${{ steps.meta.outputs.tag }}
  image-uri:
    description: Fully-qualified image URI including the tag
    value: ${{ steps.meta.outputs.uri }}
  digest:
    description: Image digest returned by the push
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Compute image tag
      id: meta
      shell: bash
      run: |
        # Identical to GitLab's `echo $CI_COMMIT_SHA | cut -c1-8`, so image tags
        # stay continuous across the migration and ArgoCD sees no change.
        tag="${GITHUB_SHA:0:8}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "uri=${{ inputs.ecr-registry }}/${{ inputs.image-name }}:$tag" >> "$GITHUB_OUTPUT"
        echo "Image tag: $tag"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify identity
      shell: bash
      run: aws sts get-caller-identity

    - name: Materialise .env from Secrets Manager
      if: inputs.env-secret-id != ''
      shell: bash
      env:
        SECRET_ID: ${{ inputs.env-secret-id }}
        REGION: ${{ inputs.aws-region }}
        CONTEXT: ${{ inputs.context }}
      run: |
        # The GitLab job printed this file with `cat .env`, leaking every secret
        # into the job log. Deliberately not carried over.
        set -euo pipefail
        aws secretsmanager get-secret-value \
          --secret-id "$SECRET_ID" --region "$REGION" \
          --query SecretString --output text \
          | jq -r 'to_entries[] | "\(.key)=\(.value)"' > "$CONTEXT/.env"
        echo "Wrote $(wc -l < "$CONTEXT/.env") variables to .env"

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        push: true
        build-args: ${{ inputs.build-args }}
        tags: |
          ${{ steps.meta.outputs.uri }}
          ${{ inputs.push-latest == 'true' && format('{0}/{1}:latest', inputs.ecr-registry, inputs.image-name) || '' }}
        cache-from: type=gha,scope=${{ inputs.image-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

    - name: Summary
      shell: bash
      run: |
        {
          echo "### Image pushed"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Image | \`${{ steps.meta.outputs.uri }}\` |"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
